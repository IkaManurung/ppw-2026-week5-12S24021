openapi: 3.0.3
info:
  title: SIPUS-Del API
  version: 1.0.0
  description: Kontrak SOAP dan REST API SIPUS-Del Week 9.
servers:
  - url: http://127.0.0.1:8000
tags:
  - name: Authentication
  - name: Books
  - name: Loans
  - name: Consumer
  - name: SOAP
paths:
  /api/v1/auth/login:
    post:
      tags: [Authentication]
      summary: Login dan memperoleh Sanctum token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: {type: string, format: email}
                password: {type: string, format: password}
      responses:
        '200': {description: Login berhasil}
        '401': {description: Kredensial tidak valid}
        '422': {description: Validasi gagal}
  /api/v1/auth/me:
    get:
      tags: [Authentication]
      security: [{BearerAuth: []}]
      summary: Data pengguna terautentikasi
      responses:
        '200': {description: Berhasil}
        '401': {description: Tidak terautentikasi}
  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      security: [{BearerAuth: []}]
      summary: Cabut token aktif
      responses:
        '200': {description: Logout berhasil}
        '401': {description: Tidak terautentikasi}
  /api/v1/bukus:
    get:
      tags: [Books]
      summary: Daftar buku dengan pencarian, filter, sorting, pagination
      parameters:
        - {name: search, in: query, schema: {type: string}, description: Cari judul, penulis, ISBN}
        - {name: kategori_id, in: query, schema: {type: integer}}
        - {name: tersedia, in: query, schema: {type: integer, enum: [1]}}
        - {name: sort, in: query, schema: {type: string, enum: [terbaru, judul, stok]}}
        - {name: per_page, in: query, schema: {type: integer, minimum: 1, maximum: 100}}
        - {name: page, in: query, schema: {type: integer, minimum: 1}}
      responses:
        '200': {description: Daftar buku terpaginasi}
    post:
      tags: [Books]
      security: [{BearerAuth: []}]
      summary: Tambah buku
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Book'}
      responses:
        '201': {description: Buku dibuat; header Location}
        '401': {description: Tidak terautentikasi}
        '422': {description: Validasi gagal}
  /api/v1/bukus/{buku}:
    parameters:
      - {name: buku, in: path, required: true, schema: {type: integer}}
    get:
      tags: [Books]
      summary: Detail buku beserta kategori dan riwayat peminjaman
      responses:
        '200': {description: Detail buku}
        '404': {description: Buku tidak ditemukan}
    put:
      tags: [Books]
      security: [{BearerAuth: []}]
      summary: Ganti seluruh data buku
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Book'}
      responses:
        '200': {description: Buku diperbarui}
        '401': {description: Tidak terautentikasi}
        '422': {description: Validasi gagal}
    patch:
      tags: [Books]
      security: [{BearerAuth: []}]
      summary: Ubah sebagian data buku
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BookPatch'}
      responses:
        '200': {description: Buku diperbarui sebagian}
        '401': {description: Tidak terautentikasi}
        '422': {description: Validasi gagal}
    delete:
      tags: [Books]
      security: [{BearerAuth: []}]
      summary: Hapus buku jika tidak ada peminjaman aktif
      responses:
        '204': {description: Berhasil dihapus}
        '409': {description: Masih ada peminjaman aktif}
  /api/v1/bukus/{buku}/referensi-eksternal:
    get:
      tags: [Consumer]
      summary: Ambil metadata buku dari OpenLibrary
      parameters:
        - {name: buku, in: path, required: true, schema: {type: integer}}
      responses:
        '200': {description: Referensi ditemukan atau data null}
        '502': {description: Gateway error}
        '503': {description: Layanan eksternal tidak tersedia}
  /api/v1/peminjamans:
    get:
      tags: [Loans]
      security: [{BearerAuth: []}]
      summary: Daftar peminjaman dengan filter NIM dan status
      parameters:
        - {name: nim, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {type: string, enum: [dipinjam, dikembalikan]}}
        - {name: per_page, in: query, schema: {type: integer, minimum: 1, maximum: 100}}
      responses:
        '200': {description: Daftar peminjaman}
        '401': {description: Tidak terautentikasi}
        '422': {description: Filter tidak valid}
    post:
      tags: [Loans]
      security: [{BearerAuth: []}]
      summary: Buat peminjaman menggunakan transaksi database
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [buku_id, nim_peminjam, nama_peminjam, durasi_hari]
              properties:
                buku_id: {type: integer}
                nim_peminjam: {type: string}
                nama_peminjam: {type: string}
                durasi_hari: {type: integer, minimum: 1, maximum: 30}
      responses:
        '201': {description: Peminjaman berhasil}
        '409': {description: Peminjaman aktif duplikat}
        '422': {description: Stok tidak tersedia atau validasi gagal}
  /api/v1/peminjamans/{peminjaman}/kembalikan:
    patch:
      tags: [Loans]
      security: [{BearerAuth: []}]
      summary: Kembalikan buku dan tambah stok
      parameters:
        - {name: peminjaman, in: path, required: true, schema: {type: integer}}
      responses:
        '200': {description: Pengembalian berhasil}
        '409': {description: Buku sudah dikembalikan}
  /soap/sipus.wsdl:
    get:
      tags: [SOAP]
      summary: Ambil kontrak WSDL SOAP
      responses:
        '200': {description: Dokumen WSDL}
  /soap/sipus:
    post:
      tags: [SOAP]
      summary: Periksa status clearance peminjam via SOAP XML
      requestBody:
        required: true
        content:
          text/xml:
            schema: {type: string}
      responses:
        '200': {description: SOAP XML response}
        '500': {description: SOAP Fault}
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
  schemas:
    Book:
      type: object
      required: [isbn, judul, penulis, penerbit, tahun_terbit, kategori_id, stok]
      properties:
        isbn: {type: string, maxLength: 20}
        judul: {type: string, minLength: 5, maxLength: 200}
        penulis: {type: string, maxLength: 150}
        penerbit: {type: string, maxLength: 150}
        tahun_terbit: {type: integer, minimum: 1900}
        kategori_id: {type: integer}
        stok: {type: integer, minimum: 0}
        sinopsis: {type: string, nullable: true}
    BookPatch:
      type: object
      properties:
        isbn: {type: string}
        judul: {type: string}
        penulis: {type: string}
        penerbit: {type: string}
        tahun_terbit: {type: integer}
        kategori_id: {type: integer}
        stok: {type: integer, minimum: 0}
        sinopsis: {type: string, nullable: true}
